name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: HTML, JavaScript e formatação
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Preparar pnpm na versão do package.json
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: false

      - name: Instalar dependências conforme o lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validar HTML
        run: pnpm run lint:html

      - name: Analisar JavaScript
        run: pnpm run lint:js

      - name: Conferir formatação
        run: pnpm run format:check
